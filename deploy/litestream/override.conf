# /etc/systemd/system/litestream.service.d/override.conf
[Service]
# Run as the DB owner so the .kodji.sqlite-litestream metadata dir and the
# WAL are not root-owned. The env file holds LITESTREAM_ACCESS_KEY_ID and
# LITESTREAM_SECRET_ACCESS_KEY for the R2 API token (Object Read & Write
# on the one bucket).
User=kodji
Group=kodji
EnvironmentFile=/etc/litestream.env
